<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅マップメモリー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --paper: #fffdf8;
      --ink: #1d2a2e;
      --muted: #69787d;
      --line: #d9dfd8;
      --sea: #cfe7ee;
      --land: #e7eadf;
      --visited: #f0b44f;
      --selected: #3b8ea5;
      --danger: #c65353;
      --ok: #477f5b;
      --shadow: 0 18px 50px rgba(35, 54, 58, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      padding: 0 12px;
      cursor: pointer;
    }

    button.primary {
      background: #2f7f95;
      border-color: #2f7f95;
      color: #fff;
    }

    button.danger {
      color: #fff;
      background: var(--danger);
      border-color: var(--danger);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(330px, 430px);
      min-height: 100vh;
    }

    .map-side {
      position: relative;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0)),
        var(--sea);
      overflow: auto;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 780px;
      margin: 0 auto 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.1;
    }

    .version {
      margin-left: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      vertical-align: middle;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 84px;
      padding: 8px 10px;
      border: 1px solid rgba(72, 108, 116, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      text-align: right;
    }

    .stat b {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .map-wrap {
      position: relative;
      max-width: 780px;
      margin: 0 auto;
      padding: 14px;
      border: 1px solid rgba(72, 108, 116, 0.18);
      border-radius: 8px;
      background: var(--sea);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      cursor: grab;
      user-select: none;
      background: var(--sea);
    }

    svg.dragging {
      cursor: grabbing;
    }

    .map-controls {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: grid;
      grid-template-columns: repeat(3, 38px);
      gap: 7px;
      z-index: 2;
    }

    .map-controls button {
      width: 38px;
      min-height: 38px;
      padding: 0;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 24px rgba(35, 54, 58, 0.16);
    }

    .pref rect,
    .pref path {
      fill: var(--land);
      stroke: rgba(43, 79, 86, 0.5);
      stroke-width: 1.2;
      cursor: pointer;
      transition: fill 150ms ease, transform 150ms ease, filter 150ms ease;
    }

    .pref:hover rect,
    .pref:hover path {
      filter: brightness(1.04);
    }

    .pref.visited rect,
    .pref.visited path {
      fill: var(--visited);
    }

    .pref.selected rect,
    .pref.selected path {
      fill: var(--selected);
      stroke: #174a59;
      stroke-width: 2.4;
    }

    .pref text {
      pointer-events: none;
      font-size: 13px;
      font-weight: 800;
      fill: #26383c;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .pref.selected text {
      fill: #fff;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      border-left: 1px solid var(--line);
      background: var(--paper);
    }

    .panel-head,
    .panel-body,
    .panel-foot {
      padding: 18px;
    }

    .panel-head {
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .panel-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow: auto;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="date"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .check-row strong {
      display: block;
      font-size: 15px;
    }

    .check-row span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="checkbox"] {
      width: 26px;
      height: 26px;
      accent-color: var(--ok);
    }

    .file-box {
      border: 1px dashed #abb8ac;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .file-box input {
      width: 100%;
    }

    .photo-hint {
      margin: -2px 0 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f1f1eb;
      aspect-ratio: 4 / 3;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .photo button {
      position: absolute;
      top: 6px;
      right: 6px;
      min-height: 30px;
      height: 30px;
      padding: 0 9px;
      border: 0;
      background: rgba(22, 28, 30, 0.78);
      color: #fff;
    }

    .empty {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      line-height: 1.6;
      font-size: 14px;
    }

    .panel-foot {
      display: grid;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      max-width: min(92vw, 420px);
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(29, 42, 46, 0.92);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 5;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden-input {
      display: none;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .map-side {
        height: 100vh;
        height: 100svh;
        min-height: 0;
        padding: 10px;
        overflow: hidden;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 24px;
      }

      .stats {
        width: 100%;
        justify-content: stretch;
      }

      .stat {
        flex: 1;
        text-align: left;
        min-width: 0;
        padding: 7px 8px;
      }

      .stat span {
        font-size: 17px;
      }

      .map-wrap {
        display: grid;
        place-items: center;
        width: 100%;
        height: calc(100vh - 118px);
        height: calc(100svh - 118px);
        min-height: 0;
        padding: 8px;
        overflow: hidden;
      }

      .map-wrap svg {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }

      .map-controls {
        right: 8px;
        bottom: 8px;
      }

      .side-panel {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .panel-head,
      .panel-body,
      .panel-foot {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="map-side" aria-label="日本地図">
      <div class="toolbar">
        <h1>旅マップメモリー <span class="version">v7</span></h1>
        <div class="stats">
          <div class="stat"><b>訪問</b><span id="visitedCount">0</span></div>
          <div class="stat"><b>写真</b><span id="photoCount">0</span></div>
          <div class="stat"><b>達成率</b><span id="rate">0%</span></div>
        </div>
      </div>

      <div class="map-wrap">
        <svg id="japanMap" viewBox="0 0 620 860" preserveAspectRatio="xMidYMid meet" role="img" aria-label="都道府県マップ">
          <rect x="0" y="0" width="620" height="860" rx="18" fill="#cfe7ee"></rect>
          <g id="mapContent">
            <g id="prefsLayer"></g>
          </g>
        </svg>
        <div class="map-controls" aria-label="地図操作">
          <button id="zoomOutBtn" type="button" title="縮小">−</button>
          <button id="resetMapBtn" type="button" title="位置を戻す">◎</button>
          <button id="zoomInBtn" type="button" title="拡大">＋</button>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <header class="panel-head">
        <h2 id="prefTitle">北海道</h2>
        <p id="prefSub">地図の都道府県をタップして、旅の記録を残せます。</p>
      </header>

      <section class="panel-body">
        <div class="check-row">
          <div>
            <strong>行った場所としてマーク</strong>
            <span>地図上で色が変わります</span>
          </div>
          <input id="visitedInput" type="checkbox" aria-label="訪問済みにする">
        </div>

        <label>
          訪問日
          <input id="dateInput" type="date">
        </label>

        <label>
          メモ
          <textarea id="memoInput" placeholder="食べたもの、泊まった場所、また行きたい場所など"></textarea>
        </label>

        <div class="file-box">
          <label>
            写真を追加
            <input id="photoInput" type="file" accept="image/*" multiple>
          </label>
        </div>
        <p id="photoHint" class="photo-hint">
          写真に位置情報がある場合は、都道府県を自動判定して保存します。判定できない写真は選択中の都道府県に保存します。
        </p>

        <div id="gallery" class="gallery"></div>
        <div id="emptyPhotos" class="empty">まだ写真はありません。スマホの写真を選ぶと、この都道府県に紐づいて保存されます。</div>
      </section>

      <footer class="panel-foot">
        <div class="actions">
          <button id="saveBtn" class="primary" type="button">保存</button>
          <button id="clearBtn" class="danger" type="button">この県を削除</button>
        </div>
        <div class="data-actions">
          <button id="exportBtn" type="button">書き出し</button>
          <button id="importBtn" type="button">読み込み</button>
        </div>
        <p class="photo-hint">境界データ: jpn-atlas / 地球地図日本</p>
        <input id="importInput" class="hidden-input" type="file" accept="application/json,.json">
      </footer>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

      const DB_NAME = "travel-japan-memory-db";

      let db;

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function dbGet(key) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const req = tx.objectStore(STORE).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function dbSet(key, value) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(value, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      function record(id = selected) {
        if (!data[id]) data[id] = { visited: false, date: "", memo: "", photos: [] };
        if (!Array.isArray(data[id].photos)) data[id].photos = [];
        return data[id];
      }

      function prefName(id) {
        return PREFS.find((pref) => pref[0] === id)?.[1] || id;
      }

      function isSmallScreen() {
        return window.matchMedia("(max-width: 860px)").matches;
      }

      function clampMapView() {
        const margin = isSmallScreen() ? 80 : 28;
        const minX = 620 - MAP_BOUNDS.maxX * mapView.scale - margin;
        const maxX = margin - MAP_BOUNDS.minX * mapView.scale;
        const minY = 860 - MAP_BOUNDS.maxY * mapView.scale - margin;
        const maxY = margin - MAP_BOUNDS.minY * mapView.scale;
        mapView.x = Math.max(minX, Math.min(maxX, mapView.x));
        mapView.y = Math.max(minY, Math.min(maxY, mapView.y));
      }

      function applyMapTransform() {
        clampMapView();
        mapContent.setAttribute("transform", `matrix(${mapView.scale} 0 0 ${mapView.scale} ${mapView.x} ${mapView.y})`);
      }

      function resetMapView() {
        mapView.scale = isSmallScreen() ? 1.55 : 1.2;
        const centerX = (MAP_BOUNDS.minX + MAP_BOUNDS.maxX) / 2;
        const centerY = (MAP_BOUNDS.minY + MAP_BOUNDS.maxY) / 2;
        mapView.x = 310 - centerX * mapView.scale;
        mapView.y = 430 - centerY * mapView.scale;
        applyMapTransform();
      }

      function zoomMap(delta) {
        const next = Math.max(1, Math.min(2.8, mapView.scale + delta));
        const centerX = 310;
        const centerY = 430;
        const ratio = next / mapView.scale;
        mapView.x = centerX - (centerX - mapView.x) * ratio;
        mapView.y = centerY - (centerY - mapView.y) * ratio;
        mapView.scale = next;
        applyMapTransform();
      }

      function buildMap() {
        const offsetX = MAP_OFFSET_X;
        for (const [id, name, x, y, w, h] of PREFS) {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.classList.add("pref");
          g.dataset.id = id;
          g.setAttribute("tabindex", "0");
          g.setAttribute("role", "button");
          g.setAttribute("aria-label", name);

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", x + offsetX);
          rect.setAttribute("y", y);
          rect.setAttribute("width", w);
          rect.setAttribute("height", h);
          rect.setAttribute("rx", 10);

          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", x + offsetX + w / 2);
          text.setAttribute("y", y + h / 2);
          text.textContent = name.length > 3 ? name.slice(0, 2) : name;

          g.append(rect, text);
          g.addEventListener("click", () => {
            if (suppressPrefClick) return;
            selectPref(id);
          });
          g.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectPref(id);
            }
          });
          mapLayer.appendChild(g);
        }
      }

      function renderMap() {
        for (const node of mapLayer.querySelectorAll(".pref")) {
          const id = node.dataset.id;
          node.classList.toggle("visited", Boolean(data[id]?.visited));
          node.classList.toggle("selected", id === selected);
        }
      }

      function renderStats() {
        const visited = PREFS.filter(([id]) => data[id]?.visited).length;
        const photos = PREFS.reduce((sum, [id]) => sum + (data[id]?.photos?.length || 0), 0);
        visitedCount.textContent = String(visited);
        photoCount.textContent = String(photos);
        rate.textContent = `${Math.round((visited / PREFS.length) * 100)}%`;
      }

      function renderPanel() {
        const r = record();
        prefTitle.textContent = prefName(selected);
        prefSub.textContent = r.visited ? "訪問済みとして記録されています。" : "未訪問です。旅の記録を追加できます。";
        visitedInput.checked = Boolean(r.visited);
        dateInput.value = r.date || "";
        memoInput.value = r.memo || "";
        gallery.innerHTML = "";
        emptyPhotos.style.display = r.photos.length ? "none" : "block";

        for (const photo of r.photos) {
          const item = document.createElement("div");
          item.className = "photo";

          const img = document.createElement("img");
          img.src = photo.dataUrl;
          img.alt = `${prefName(selected)}の写真`;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "削除";
          remove.addEventListener("click", async () => {
            record().photos = record().photos.filter((p) => p.id !== photo.id);
            await persist();
            renderAll();
            showToast("写真を削除しました");
          });

          item.append(img, remove);
          gallery.appendChild(item);
        }
      }

      function renderAll() {
        renderMap();
        renderStats();
        renderPanel();
      }

      function selectPref(id) {
        selected = id;
        renderAll();
      }

      async function persist() {
        await dbSet(DATA_KEY, data);
      }

      async function saveCurrent() {
        const r = record();
        r.visited = visitedInput.checked;
        r.date = dateInput.value;
        r.memo = memoInput.value.trim();
        await persist();
        renderAll();
        showToast(`${prefName(selected)}を保存しました`);

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = dataUrl;
        });
      }

      async function compressImage(file) {
        const source = await fileToDataUrl(file);
        const img = await loadImage(source);
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.82);
      }

      function readAscii(view, offset, length) {
        let result = "";
        for (let i = 0; i < length; i += 1) {
          const code = view.getUint8(offset + i);
          if (code === 0) break;
          result += String.fromCharCode(code);
        }
        return result;
      }

      function readRational(view, offset, littleEndian) {
        const numerator = view.getUint32(offset, littleEndian);
        const denominator = view.getUint32(offset + 4, littleEndian);
        return denominator ? numerator / denominator : 0;
      }

      function readGpsCoordinate(view, tiffStart, entryOffset, littleEndian) {
        const count = view.getUint32(entryOffset + 4, littleEndian);
        const valueOffset = view.getUint32(entryOffset + 8, littleEndian);
        const valuesAt = tiffStart + valueOffset;
        const values = [];
        for (let i = 0; i < Math.min(count, 3); i += 1) {
          values.push(readRational(view, valuesAt + i * 8, littleEndian));
        }
        return values[0] + values[1] / 60 + values[2] / 3600;
      }

      async function readPhotoGps(file) {
        const buffer = await file.arrayBuffer();
        const view = new DataView(buffer);
        if (view.byteLength < 4 || view.getUint16(0, false) !== 0xffd8) return null;

        let offset = 2;
        while (offset + 4 < view.byteLength) {
          const marker = view.getUint16(offset, false);
          const size = view.getUint16(offset + 2, false);
          if (marker === 0xffe1 && readAscii(view, offset + 4, 6) === "Exif") {
            const tiffStart = offset + 10;
            const littleEndian = readAscii(view, tiffStart, 2) === "II";
            if (view.getUint16(tiffStart + 2, littleEndian) !== 42) return null;

            const ifdOffset = tiffStart + view.getUint32(tiffStart + 4, littleEndian);
            const entryCount = view.getUint16(ifdOffset, littleEndian);
            let gpsIfdOffset = 0;
            for (let i = 0; i < entryCount; i += 1) {
              const entry = ifdOffset + 2 + i * 12;
              if (view.getUint16(entry, littleEndian) === 0x8825) {
                gpsIfdOffset = tiffStart + view.getUint32(entry + 8, littleEndian);
                break;
              }
            }
            if (!gpsIfdOffset) return null;

            const gpsEntryCount = view.getUint16(gpsIfdOffset, littleEndian);
            let lat;
            let lon;
            let latRef = "N";
            let lonRef = "E";
            for (let i = 0; i < gpsEntryCount; i += 1) {
              const entry = gpsIfdOffset + 2 + i * 12;
              const tag = view.getUint16(entry, littleEndian);
              if (tag === 1) latRef = readAscii(view, entry + 8, 2);
              if (tag === 2) lat = readGpsCoordinate(view, tiffStart, entry, littleEndian);
              if (tag === 3) lonRef = readAscii(view, entry + 8, 2);
              if (tag === 4) lon = readGpsCoordinate(view, tiffStart, entry, littleEndian);
            }

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            if (latRef === "S") lat *= -1;
            if (lonRef === "W") lon *= -1;
            return { lat, lon };
          }
          offset += 2 + size;
        }
        return null;
      }

      function parseGpsNumber(value, ref = "") {
        if (!value) return null;
        const text = String(value).trim();
        const decimal = Number(text.replace(/[NSEW]/gi, ""));
        if (Number.isFinite(decimal)) {
          return /[SW]/i.test(ref || text) ? -Math.abs(decimal) : Math.abs(decimal);
        }
        const parts = text.match(/-?\d+(?:\.\d+)?/g);
        if (!parts || !parts.length) return null;
        const degrees = Number(parts[0]);
        const minutes = Number(parts[1] || 0);
        const seconds = Number(parts[2] || 0);
        if (!Number.isFinite(degrees) || !Number.isFinite(minutes) || !Number.isFinite(seconds)) return null;
        const sign = degrees < 0 || /[SW]/i.test(ref || text) ? -1 : 1;
        return sign * (Math.abs(degrees) + minutes / 60 + seconds / 3600);
      }

      async function readPhotoGpsFromXmp(file) {
        const buffer = await file.arrayBuffer();
        const text = new TextDecoder("utf-8", { fatal: false }).decode(buffer.slice(0, Math.min(buffer.byteLength, 512 * 1024)));
        const latMatch = text.match(/(?:exif:)?GPSLatitude=["']([^"']+)["']/i);
        const lonMatch = text.match(/(?:exif:)?GPSLongitude=["']([^"']+)["']/i);
        if (!latMatch || !lonMatch) return null;
        const latRef = text.match(/(?:exif:)?GPSLatitudeRef=["']([^"']+)["']/i)?.[1] || latMatch[1];
        const lonRef = text.match(/(?:exif:)?GPSLongitudeRef=["']([^"']+)["']/i)?.[1] || lonMatch[1];
        const lat = parseGpsNumber(latMatch[1], latRef);
        const lon = parseGpsNumber(lonMatch[1], lonRef);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
        return { lat, lon };
      }

      function decodeArc(arcIndex, arcs, transform) {
        const source = arcs[arcIndex < 0 ? ~arcIndex : arcIndex];
        let x = 0;
        let y = 0;
        const points = source.map(([dx, dy]) => {
          x += dx;
          y += dy;
          return [
            x * transform.scale[0] + transform.translate[0],
            y * transform.scale[1] + transform.translate[1]
          ];
        });
        return arcIndex < 0 ? points.reverse() : points;
      }

      function decodeRing(arcIndexes, topology) {
        const ring = [];
        for (const arcIndex of arcIndexes) {
          const points = decodeArc(arcIndex, topology.arcs, topology.transform);
          if (ring.length) points.shift();
          ring.push(...points);
        }
        return ring;
      }

      function ringBounds(ring) {
        return ring.reduce((bounds, [lon, lat]) => ({
          minLon: Math.min(bounds.minLon, lon),
          maxLon: Math.max(bounds.maxLon, lon),
          minLat: Math.min(bounds.minLat, lat),
          maxLat: Math.max(bounds.maxLat, lat)
        }), { minLon: Infinity, maxLon: -Infinity, minLat: Infinity, maxLat: -Infinity });
      }

      function decodePrefectureBoundaries() {
        if (decodedPrefectureBoundaries) return decodedPrefectureBoundaries;
        decodedPrefectureBoundaries = JP_PREF_TOPOLOGY.objects.prefectures.geometries.map((geometry) => {
          const polygons = geometry.type === "Polygon" ? [geometry.arcs] : geometry.arcs;
          return {
            prefId: JP_PREF_ID_TO_APP_ID[geometry.id],
            polygons: polygons.map((polygon) => {
              const rings = polygon.map((ring) => decodeRing(ring, JP_PREF_TOPOLOGY));
              return { rings, bounds: ringBounds(rings[0]) };
            })
          };
        });
        return decodedPrefectureBoundaries;
      }

      function pointInRing(point, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i, i += 1) {
          const xi = ring[i][0];
          const yi = ring[i][1];
          const xj = ring[j][0];
          const yj = ring[j][1];
          const intersects = ((yi > point.lat) !== (yj > point.lat))
            && (point.lon < ((xj - xi) * (point.lat - yi)) / (yj - yi) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function pointInPolygon(point, polygon) {
        const b = polygon.bounds;
        if (point.lon < b.minLon || point.lon > b.maxLon || point.lat < b.minLat || point.lat > b.maxLat) return false;
        if (!pointInRing(point, polygon.rings[0])) return false;
        return !polygon.rings.slice(1).some((ring) => pointInRing(point, ring));
      }

      function prefectureFromGps(gps) {
        const point = { lon: gps.lon, lat: gps.lat };
        for (const pref of decodePrefectureBoundaries()) {
          if (pref.polygons.some((polygon) => pointInPolygon(point, polygon))) return pref.prefId;
        }
        return "";
      }

      async function detectPrefectureFromPhoto(file) {
        try {
          const gps = await readPhotoGps(file) || await readPhotoGpsFromXmp(file);
          return gps ? prefectureFromGps(gps) : "";
        } catch {
          return "";
        }
      }

      async function addPhotos(files) {
        if (!files.length) return;
        await saveCurrent();
        saveBtn.disabled = true;
        photoInput.disabled = true;
        let detectedCount = 0;
        let fallbackCount = 0;
        let lastTargetPref = selected;
        try {
          for (const file of files) {
            if (!file.type.startsWith("image/")) continue;
            const detectedPref = await detectPrefectureFromPhoto(file);
            const targetPref = detectedPref || selected;
            const dataUrl = await compressImage(file);
            record(targetPref).photos.push({
              id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
              name: file.name,
              dataUrl,
              createdAt: new Date().toISOString(),
              detectedPrefecture: Boolean(detectedPref)
            });
            record(targetPref).visited = true;
            lastTargetPref = targetPref;
            if (detectedPref) detectedCount += 1;
            else fallbackCount += 1;
          }
          await persist();
          if (detectedCount > 0) selected = lastTargetPref;
          renderAll();
          if (detectedCount > 0) {
            showToast(`写真を保存しました。${detectedCount}件を位置情報から自動分類しました`);
          } else if (fallbackCount > 0) {
            showToast("写真を保存しました。位置情報をブラウザから読めないため、選択中の都道府県に保存しました");
          } else {
            showToast("写真を保存しました");
          }
        } finally {
          saveBtn.disabled = false;
          photoInput.disabled = false;
          photoInput.value = "";
        }
      }

      function downloadJson() {
        const blob = new Blob([JSON.stringify({ version: 1, data }, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `travel-japan-memory-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function importJson(file) {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed || typeof parsed !== "object" || !parsed.data) throw new Error("Invalid data");
        data = parsed.data;
        await persist();
        renderAll();
        showToast("データを読み込みました");
      }

      saveBtn.addEventListener("click", saveCurrent);
      visitedInput.addEventListener("change", () => {
        record().visited = visitedInput.checked;
        renderMap();
        renderStats();
      });
      photoInput.addEventListener("change", (event) => addPhotos([...event.target.files]));
      clearBtn.addEventListener("click", async () => {
        if (!confirm(`${prefName(selected)}のメモと写真を削除しますか?`)) return;
        delete data[selected];
        await persist();
        renderAll();
        showToast("削除しました");
      });
      exportBtn.addEventListener("click", downloadJson);
      importBtn.addEventListener("click", () => importInput.click());
      importInput.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          await importJson(file);
        } catch {
          showToast("読み込みに失敗しました");
        } finally {
          importInput.value = "";
        }
      });
      zoomOutBtn.addEventListener("click", () => zoomMap(-0.18));
      zoomInBtn.addEventListener("click", () => zoomMap(0.18));
      resetMapBtn.addEventListener("click", resetMapView);
      japanMap.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const downPref = event.target.closest?.(".pref");
        mapView.dragging = true;
        mapView.pointerId = event.pointerId;
        mapView.startX = event.clientX;
        mapView.startY = event.clientY;
        mapView.startViewX = mapView.x;
        mapView.startViewY = mapView.y;
        mapView.downPrefId = downPref?.dataset.id || null;
        suppressPrefClick = false;
        japanMap.classList.add("dragging");
        japanMap.setPointerCapture(event.pointerId);
      });
      japanMap.addEventListener("pointermove", (event) => {
        if (!mapView.dragging || event.pointerId !== mapView.pointerId) return;
        event.preventDefault();
        const rect = japanMap.getBoundingClientRect();
        const unitX = 620 / rect.width;
        const unitY = 860 / rect.height;
        const dx = event.clientX - mapView.startX;
        const dy = event.clientY - mapView.startY;
        if (Math.hypot(dx, dy) > 5) suppressPrefClick = true;
        mapView.x = mapView.startViewX + dx * unitX;
        mapView.y = mapView.startViewY + dy * unitY;
        applyMapTransform();
      });
      japanMap.addEventListener("pointerup", (event) => {
        if (event.pointerId !== mapView.pointerId) return;
        if (!suppressPrefClick && mapView.downPrefId) {
          selectPref(mapView.downPrefId);
        }
        mapView.dragging = false;
        mapView.pointerId = null;
        mapView.downPrefId = null;
        japanMap.classList.remove("dragging");
        window.setTimeout(() => {
          suppressPrefClick = false;
        }, 0);
      });
      japanMap.addEventListener("pointercancel", () => {
        mapView.dragging = false;
        mapView.pointerId = null;
        japanMap.classList.remove("dragging");
      });
      japanMap.addEventListener("wheel", (event) => {
        event.preventDefault();
        zoomMap(event.deltaY > 0 ? -0.12 : 0.12);
      }, { passive: false });
      window.addEventListener("resize", resetMapView);

      async function init() {
        buildMap();
        resetMapView();
        db = await openDb();
        data = (await dbGet(DATA_KEY)) || {};
        renderAll();
      }

      init().catch(() => {
        document.body.innerHTML = "<p style='padding:20px;font-family:sans-serif'>ブラウザ内保存を開始できませんでした。通常モードのブラウザで開いてください。</p>";
      });
    })();
  </script>
</body>
</html>
